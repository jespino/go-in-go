baseURL = "https://jespino.github.io/go-in-go/"
title = "go-in-go"
locale = "en-US"
disableKinds = ["taxonomy", "term", "rss"]
enableRobotsTXT = true

[params]
  tagline = "Go modules for any Go version"
  description = "Build Go code once with TinyGo and load it into any Go program, whatever Go version it's built with: no cgo, no dlopen, no libc."
  repo = "https://github.com/jespino/go-in-go"
  contentPath = "site/content"
  badge = "experimental"
  mascot = "img/gopher-gopher.png"
  socialImage = "img/social.png"
  mascotAlt = "The Go gopher in a Go gopher costume"
  accent = "#007d9c"
  accentDark = "#5dc9e2"
  sidebar = ["/docs", "/api"]
  license = "Released under the [MIT License](https://github.com/jespino/go-in-go/blob/main/LICENSE)."
  footer = "The mascot is based on the Go gopher by [Renée French](https://reneefrench.blogspot.com/) ([CC BY 4.0](https://creativecommons.org/licenses/by/4.0/)), dressed as a Go gopher: Go inside Go."

[[menus.main]]
  name = "Docs"
  pageRef = "/docs"
  weight = 1
[[menus.main]]
  name = "Tutorial"
  pageRef = "/docs/tutorial"
  weight = 2
[[menus.main]]
  name = "API"
  pageRef = "/api"
  weight = 3

[markup.highlight]
  noClasses = false
[markup.tableOfContents]
  startLevel = 2
  endLevel = 3

[[module.mounts]]
  source = "static"
  target = "static"
[[module.mounts]]
  source = "../assets"
  target = "static/img"

# The gopherdocs theme, shared with the other tinyguest-based tools.
[[module.imports]]
  path = "github.com/jespino/tinyguest/theme"
